server:
  port: 8096
  # Ne jamais divulguer les détails techniques (stacktrace, classe d'exception) au client.
  error:
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

spring:
  application:
    name: mtdpce-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mtdpce_db}
    username: ${DB_USERNAME:mtdpce_user}
    password: ${DB_PASSWORD:mtdpce2026}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: mtdpce
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Africa/Ouagadougou

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Paramètres applicatifs (réinitialisation de mot de passe)
app:
  mail:
    # Mettre MAIL_ENABLED=true + identifiants SMTP pour l'envoi réel des emails.
    # Sinon le lien de réinitialisation est journalisé dans les logs (mode dev).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@mtdpce.gov.bf}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  # URL publique du site, utilisée pour générer le sitemap.xml dynamique.
  public-url: ${SITE_URL:https://site-test.tic.gov.bf}
  password-reset:
    token-validity-minutes: 60
  # Dossier de stockage des fichiers uploadés.
  # En local : sous le HOME (toujours accessible en écriture). En prod : /opt/mtdpce/uploads via la variable UPLOAD_BASE_PATH.
  upload:
    base-path: ${UPLOAD_BASE_PATH:${user.home}/mtdpce-uploads}

# JWT Configuration
jwt:
  secret: MTDPCEBurkinaFaso2024SecretKeyForJWTTokenGenerationAndValidation256Bits
  expiration: 86400000

# Swagger / OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

# CORS Configuration
cors:
  allowed-origins: "https://site-test.tic.gov.bf,https://api.site-test.tic.gov.bf,http://localhost:4200"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    root: INFO
    bf.gov.mtdpce: DEBUG
    org.springframework.security: DEBUG

facebook:
  page-id: ${FACEBOOK_PAGE_ID:308567739007291}
  # Secret : fourni via la variable d'environnement FACEBOOK_ACCESS_TOKEN (jamais commité).
  access-token: ${FACEBOOK_ACCESS_TOKEN:}
  graph-api-url: ${FACEBOOK_GRAPH_API_URL:https://graph.facebook.com/v25.0}
  base-url: ${FACEBOOK_BASE_URL:https://site-test.tic.gov.bf}
