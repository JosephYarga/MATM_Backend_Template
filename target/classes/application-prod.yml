server:
  port: 8096
  # Ne jamais divulguer les détails techniques au client en production.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

# Stockage des fichiers en production
app:
  # URL publique du site, utilisée pour générer le sitemap.xml dynamique.
  public-url: ${SITE_URL:https://site-test.tic.gov.bf}
  upload:
    base-path: ${UPLOAD_BASE_PATH:/opt/mtdpce/uploads}

spring:
  application:
    name: mtdpce-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mtdpce_db}
    username: ${DB_USERNAME:mtdpce_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: mtdpce
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Africa/Ouagadougou

# JWT Configuration
jwt:
  secret: MTDPCEBurkinaFaso2024SecretKeyForJWTTokenGenerationAndValidation256Bits
  expiration: 86400000

# Swagger / OpenAPI : DÉSACTIVÉ en production (n'expose pas la surface d'API ni la version).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# CORS Configuration
cors:
  allowed-origins: "https://site-test.tic.gov.bf,https://api.site-test.tic.gov.bf,http://localhost:4200"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging : niveaux réduits en production (évite de journaliser des données sensibles).
logging:
  level:
    root: WARN
    bf.gov.mtdpce: INFO
    org.springframework.security: WARN

facebook:
  page-id: ${FACEBOOK_PAGE_ID:308567739007291}
  # Secret : fourni via la variable d'environnement FACEBOOK_ACCESS_TOKEN (jamais commité).
  access-token: ${FACEBOOK_ACCESS_TOKEN:}
  graph-api-url: https://graph.facebook.com/v25.0
  base-url: https://site-test.tic.gov.bf